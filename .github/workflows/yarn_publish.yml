name: Publish package to npm registry

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24' 
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: yarn       
      - run: npm publish --access public --provenance --tag staging